<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1320" font-family="'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif">
  <defs>
    <linearGradient id="bgM" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eafaf1"/>
      <stop offset="1" stop-color="#f7fffb"/>
    </linearGradient>
    <linearGradient id="heroM" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e8f"/>
      <stop offset="1" stop-color="#e0a326"/>
    </linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f9e8f"/>
      <stop offset="1" stop-color="#3bb59a"/>
    </linearGradient>
    <filter id="shM" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#2f9e8f" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="1000" height="1320" fill="url(#bgM)"/>

  <!-- header -->
  <text x="500" y="68" text-anchor="middle" font-size="26" fill="#2f9e8f" font-weight="bold">🌱 宇土のまちづくり理念</text>
  <text x="500" y="120" text-anchor="middle" font-size="36" fill="#155e50" font-weight="bold">人口が減っても、</text>
  <text x="500" y="166" text-anchor="middle" font-size="36" fill="#155e50" font-weight="bold">暮らしの豊かさは、<tspan fill="#e0a326">減らさない。</tspan></text>
  <text x="500" y="206" text-anchor="middle" font-size="20" fill="#478">支え合う力を、未来をつくる力へ。宇土にある力をつなぎ、未来をつくる。</text>

  <!-- connection equations -->
  <g font-weight="bold">
    <!-- eq1 -->
    <g filter="url(#shM)">
      <rect x="80" y="240" width="840" height="88" rx="16" fill="#fff"/>
      <text x="120" y="296" font-size="23" fill="#155e50">人 ＋ 人</text>
      <text x="360" y="296" font-size="24" fill="#e0a326">→</text>
      <text x="410" y="296" font-size="24" fill="#155e50">「支え合う力」</text>
    </g>
    <!-- eq2 -->
    <g filter="url(#shM)">
      <rect x="80" y="342" width="840" height="88" rx="16" fill="#fff"/>
      <text x="120" y="398" font-size="23" fill="#155e50">子ども ＋ 地域</text>
      <text x="360" y="398" font-size="24" fill="#e0a326">→</text>
      <text x="410" y="398" font-size="24" fill="#155e50">「未来をつくる力」</text>
    </g>
    <!-- eq3 -->
    <g filter="url(#shM)">
      <rect x="80" y="444" width="840" height="88" rx="16" fill="#fff"/>
      <text x="120" y="500" font-size="23" fill="#155e50">産業 ＋ 産業</text>
      <text x="360" y="500" font-size="24" fill="#e0a326">→</text>
      <text x="410" y="500" font-size="24" fill="#155e50">「稼ぐ力」</text>
    </g>
    <!-- eq4 -->
    <g filter="url(#shM)">
      <rect x="80" y="546" width="840" height="88" rx="16" fill="#fff"/>
      <text x="120" y="602" font-size="23" fill="#155e50">市民 ＋ 行政</text>
      <text x="360" y="602" font-size="24" fill="#e0a326">→</text>
      <text x="410" y="602" font-size="24" fill="#155e50">「地域を動かす力」</text>
    </g>
    <!-- eq5 -->
    <g filter="url(#shM)">
      <rect x="80" y="648" width="840" height="88" rx="16" fill="#fff"/>
      <text x="120" y="704" font-size="23" fill="#155e50">データ ＋ 政策</text>
      <text x="360" y="704" font-size="24" fill="#e0a326">→</text>
      <text x="410" y="704" font-size="24" fill="#155e50">「未来を選ぶ力」</text>
    </g>
  </g>

  <!-- 5 principles compact -->
  <text x="500" y="792" text-anchor="middle" font-size="22" fill="#2f9e8f" font-weight="bold">まちづくり 5つの行動原則</text>
  <g>
    <g filter="url(#shM)"><rect x="80" y="812" width="840" height="70" rx="14" fill="#fff"/>
      <circle cx="122" cy="847" r="24" fill="url(#green)"/><text x="122" y="856" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">1</text>
      <text x="164" y="855" font-size="20" fill="#155e50" font-weight="bold">「できない理由」より「どうすればできるか」を考える</text></g>
    <g filter="url(#shM)"><rect x="80" y="892" width="840" height="70" rx="14" fill="#fff"/>
      <circle cx="122" cy="927" r="24" fill="url(#green)"/><text x="122" y="936" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">2</text>
      <text x="164" y="935" font-size="20" fill="#155e50" font-weight="bold">人を責めるのではなく、仕組みを改善する</text></g>
    <g filter="url(#shM)"><rect x="80" y="972" width="840" height="70" rx="14" fill="#fff"/>
      <circle cx="122" cy="1007" r="24" fill="url(#green)"/><text x="122" y="1016" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">3</text>
      <text x="164" y="1015" font-size="20" fill="#155e50" font-weight="bold">「立派な計画」より「暮らしの手ごたえ」を大切にする</text></g>
    <g filter="url(#shM)"><rect x="80" y="1052" width="840" height="70" rx="14" fill="#fff"/>
      <circle cx="122" cy="1087" r="24" fill="url(#green)"/><text x="122" y="1096" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">4</text>
      <text x="164" y="1095" font-size="20" fill="#155e50" font-weight="bold">行政だけで解決しない。地域の力を引き出す</text></g>
    <g filter="url(#shM)"><rect x="80" y="1132" width="840" height="70" rx="14" fill="#fff"/>
      <circle cx="122" cy="1167" r="24" fill="url(#green)"/><text x="122" y="1176" text-anchor="middle" font-size="22" fill="#fff" font-weight="bold">5</text>
      <text x="164" y="1175" font-size="20" fill="#155e50" font-weight="bold">未来から逆算して、今を選ぶ</text></g>
  </g>

  <!-- footer -->
  <g filter="url(#shM)">
    <rect x="80" y="1214" width="840" height="90" rx="18" fill="url(#heroM)"/>
    <text x="500" y="1252" text-anchor="middle" font-size="26" fill="#fff" font-weight="bold">つながりを、宇土を動かす力へ。</text>
    <text x="500" y="1286" text-anchor="middle" font-size="24" fill="#fff" font-weight="bold">未来は、みんなでつくる。</text>
  </g>
</svg>
